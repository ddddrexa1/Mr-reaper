<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MR REAPER</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>

  <main class="login-screen">

    <div class="reaper-symbol">
      ☠
    </div>

    <div class="title">
      MR REAPER
    </div>

    <div class="subtitle">
      THE ELIMINATION GAME
    </div>

    <div class="warning">
      ENTER IF YOU DARE
    </div>

    <div class="login-card">

      <label>PLAYER NAME</label>

      <input
        id="playerName"
        type="text"
        maxlength="20"
        placeholder="Enter your name"
        autocomplete="off"
      >

      <button id="createRoom">
        CREATE ROOM
      </button>

      <div class="or">
        <span>OR</span>
      </div>

      <label>ROOM CODE</label>

      <input
        id="roomCode"
        type="text"
        maxlength="5"
        placeholder="XXXXX"
        autocomplete="off"
      >

      <button id="joinRoom">
        JOIN ROOM
      </button>

    </div>

    <div id="connectionStatus">
      CONNECTING TO THE REAPER...
    </div>

  </main>

  <script src="app.js"></script>

</body>

</html>
